<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F0E5D6"/>
    </linearGradient>
  </defs>

  <!-- Fond crème -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Blobs décoratifs côté droit -->
  <g transform="translate(900,315)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="200" ry="220" fill="#E8C9B8" transform="rotate(-12)"/>
    <ellipse cx="100" cy="40" rx="120" ry="135" fill="#D9A89C" opacity="0.7" transform="rotate(8)"/>
    <ellipse cx="-60" cy="80" rx="80" ry="90" fill="#C87856" opacity="0.5"/>
  </g>

  <!-- Filet doré décoratif -->
  <line x1="100" y1="180" x2="180" y2="180" stroke="#B8985F" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <text x="100" y="220" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#A8364C" letter-spacing="3">
    RÉUSSISSEZ VOTRE PREMIÈRE DANSE
  </text>

  <!-- Titre principal -->
  <text x="100" y="320" font-family="Cormorant Garamond, Georgia, serif" font-size="84" font-weight="500" fill="#2B1F17" letter-spacing="-1.5">
    Ouverture
  </text>
  <text x="100" y="410" font-family="Cormorant Garamond, Georgia, serif" font-size="84" font-style="italic" font-weight="500" fill="#A8364C" letter-spacing="-1.5">
    de Bal.
  </text>

  <!-- Sous-titre -->
  <text x="100" y="470" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#6B5D52">
    Chorégraphies guidées, depuis votre salon.
  </text>

  <!-- Tagline pieds -->
  <text x="100" y="555" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#8A7968" letter-spacing="1.5">
    500+ COUPLES FORMÉS  ·  4.9/5 ★★★★★  ·  GARANTIE 14 JOURS
  </text>

</svg>
